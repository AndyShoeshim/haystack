components:
  cleaner:
    init_parameters:
      keep_id: false
      remove_empty_lines: true
      remove_extra_whitespaces: true
      remove_regex: null
      remove_repeated_substrings: false
      remove_substrings: null
    type: haystack.components.preprocessors.document_cleaner.DocumentCleaner
  converter:
    init_parameters:
      converter:
        init_parameters: {}
        type: haystack.components.converters.pypdf.DefaultConverter
      converter_name: null
    type: haystack.components.converters.pypdf.PyPDFToDocument
  embedder:
    init_parameters:
      api_base_url: null
      api_key:
        env_vars:
        - OPENAI_API_KEY
        strict: true
        type: env_var
      batch_size: 32
      dimensions: null
      embedding_separator: '

        '
      meta_fields_to_embed: []
      model: text-embedding-ada-002
      organization: null
      prefix: ''
      progress_bar: true
      suffix: ''
    type: haystack.components.embedders.openai_document_embedder.OpenAIDocumentEmbedder
  splitter:
    init_parameters:
      split_by: sentence
      split_length: 10
      split_overlap: 2
      split_threshold: 0
    type: haystack.components.preprocessors.document_splitter.DocumentSplitter
  writer:
    init_parameters:
      document_store:
        init_parameters:
          bm25_algorithm: BM25L
          bm25_parameters: {}
          bm25_tokenization_regex: (?u)\b\w\w+\b
          embedding_similarity_function: dot_product
        type: haystack.document_stores.in_memory.document_store.InMemoryDocumentStore
      policy: NONE
    type: haystack.components.writers.document_writer.DocumentWriter
connections:
- receiver: cleaner.documents
  sender: converter.documents
- receiver: splitter.documents
  sender: cleaner.documents
- receiver: embedder.documents
  sender: splitter.documents
- receiver: writer.documents
  sender: embedder.documents
max_loops_allowed: 100
metadata: {}

